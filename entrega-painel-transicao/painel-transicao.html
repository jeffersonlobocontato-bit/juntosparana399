<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Painel da Transição</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: barra superior fixa, abas, painel central com matriz secretarias x blocos do relatório */
:root{
  --bg:#f3f5f8; --bg-img:none; --surface:#ffffff; --ink:#14202e; --ink2:#4a586a; --muted:#7a8696; --line:#dde3ea;
  --accent:#1b4f8f; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --s-none-bg:#eef1f5; --s-none-fg:#7a8696;
  --s-req-bg:#dbe8f7; --s-req-fg:#1b4f8f;
  --s-part-bg:#fbe9c2; --s-part-fg:#7a4a00;
  --s-del-bg:#cfeadb; --s-del-fg:#14633f;
  --s-val-bg:#14633f; --s-val-fg:#ffffff;
  --s-late-bg:#f8d4d0; --s-late-fg:#a11d12;
  --crit:#a11d12; --high:#b25e00; --mod:#4a586a;
  --f-display:"Source Serif 4",Georgia,serif; --f-body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061b2e; --bg-img:linear-gradient(180deg,#0c2d4f 0,#061b2e 420px); --surface:#0c2d4f; --ink:#e3f3ff; --ink2:#b0cce2; --muted:#8eb4d4; --line:#1d4a78;
  --accent:#33b7ef; --accent-ink:#061b2e; --accent-soft:#033a68;
  --s-none-bg:#102c63; --s-none-fg:#a9c4de;
  --s-req-bg:#034c8c; --s-req-fg:#b4edff;
  --s-part-bg:#4a3a12; --s-part-fg:#f3cf7a;
  --s-del-bg:#1b4333; --s-del-fg:#8fd9b0;
  --s-val-bg:#3a9c6c; --s-val-fg:#06150e;
  --s-late-bg:#5a201b; --s-late-fg:#ffb3aa;
  --crit:#ff9a8f; --high:#f0a64d; --mod:#b0cce2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061b2e; --bg-img:linear-gradient(180deg,#0c2d4f 0,#061b2e 420px); --surface:#0c2d4f; --ink:#e3f3ff; --ink2:#b0cce2; --muted:#8eb4d4; --line:#1d4a78;
  --accent:#33b7ef; --accent-ink:#061b2e; --accent-soft:#033a68;
  --s-none-bg:#102c63; --s-none-fg:#a9c4de;
  --s-req-bg:#034c8c; --s-req-fg:#b4edff;
  --s-part-bg:#4a3a12; --s-part-fg:#f3cf7a;
  --s-del-bg:#1b4333; --s-del-fg:#8fd9b0;
  --s-val-bg:#3a9c6c; --s-val-fg:#06150e;
  --s-late-bg:#5a201b; --s-late-fg:#ffb3aa;
  --crit:#ff9a8f; --high:#f0a64d; --mod:#b0cce2; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--bg-img);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1200px;margin-inline:auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:12.5px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2);font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);padding:10px 14px;font:600 14px var(--f-body);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,td[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{background:var(--s-part-bg);color:var(--s-part-fg);padding:8px 12px;border-radius:6px;font-size:12.5px;margin-bottom:16px}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 10px}
.sub{color:var(--ink2);margin:0 0 14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi.bad .n{color:var(--crit)}
.countdown{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center}
.countdown .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.phases{display:flex;gap:6px;flex:1;min-width:280px;overflow-x:auto;padding-bottom:4px}
.ph{flex:1;min-width:104px;border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--muted)}
.ph b{display:block;color:var(--ink2);font-size:12.5px}
.ph.done{border-color:var(--s-val-bg)}
.ph.now{border-color:var(--accent)}
.ph.now b{color:var(--accent)}
.twoCol{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:900px){.twoCol{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap}
.mx td.cell{padding:3px;text-align:center}
.mx th.col{text-align:center;width:54px}
.cellbtn{display:flex;align-items:center;justify-content:center;width:100%;min-width:42px;height:34px;border-radius:5px;border:2px solid transparent;font:700 14px var(--f-body);cursor:pointer}
.cellbtn[aria-pressed="true"]{border-color:var(--ink)}
.st-0{background:var(--s-none-bg);color:var(--s-none-fg)}
.st-1{background:var(--s-req-bg);color:var(--s-req-fg)}
.st-2{background:var(--s-part-bg);color:var(--s-part-fg)}
.st-3{background:var(--s-del-bg);color:var(--s-del-fg)}
.st-4{background:var(--s-val-bg);color:var(--s-val-fg)}
.st-5{background:var(--s-late-bg);color:var(--s-late-fg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;border-radius:4px;font-weight:700;font-size:12px}
.bar{height:8px;background:var(--s-none-bg);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--s-val-bg);border-radius:4px}
.detail{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.detail[hidden]{display:none}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:600;min-width:0}
.btn{font:600 13px var(--f-body);border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 12px;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.crit{background:var(--s-late-bg);color:var(--s-late-fg)}
.pill.high{background:var(--s-part-bg);color:var(--s-part-fg)}
.pill.mod{background:var(--s-none-bg);color:var(--s-none-fg)}
.pill.ok{background:var(--s-del-bg);color:var(--s-del-fg)}
.pill.late{background:var(--s-late-bg);color:var(--s-late-fg)}
.pill.open{background:var(--s-req-bg);color:var(--s-req-fg)}
.formrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.formrow .grow{flex:1;min-width:200px}
.pend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pend li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px}
.pend li:last-child{border:0;padding:0}
.pend small{color:var(--ink2);display:block}
details.blk{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface)}
details.blk>summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.blk>summary::-webkit-details-marker{display:none}
details.blk .inner{padding:0 14px 14px}
td input{width:100%;min-width:90px}
.note{color:var(--ink2);font-size:12.5px}
.risk-score{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files span{background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:5px;font-size:12px}
.roles td:first-child{font-weight:600}
.yes{color:var(--s-del-fg);font-weight:700}.no{color:var(--muted)}
.gen{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.gen{grid-template-columns:minmax(0,1fr)}}
.gen .form{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.chk input{margin-top:3px;flex:none}
.paper{background:#ffffff;color:#1a1a1a;font-family:var(--f-display);font-size:15px;line-height:1.55;padding:40px 44px;border:1px solid var(--line);border-radius:4px;white-space:pre-wrap;min-height:560px;max-width:100%;overflow-wrap:anywhere;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:560px){.paper{padding:22px 18px}}
.paper:focus{outline:2px solid var(--accent)}
.warn{background:var(--s-part-bg);color:var(--s-part-fg);padding:8px 12px;border-radius:6px;font-size:12.5px}
.okmsg{background:var(--s-del-bg);color:var(--s-del-fg);padding:8px 12px;border-radius:6px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Painel da Transição</b><span>Governo do Paraná · mandato 2027–2030 · ambiente reservado</span></div>
    <div class="who"><button class="btn sec sm" id="theme-btn" type="button" aria-pressed="false">◐ Fundo escuro</button><span class="chip ghost">Acesso em duas etapas ativo</span><span class="chip">Alcione Gomes · Administração</span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="dash" aria-selected="true">Painel geral</button>
    <button role="tab" data-tab="of" aria-selected="false">Ofícios e prazos</button>
    <button role="tab" data-tab="gen" aria-selected="false">Gerador de ofícios</button>
    <button role="tab" data-tab="aut" aria-selected="false">Autoridades</button>
    <button role="tab" data-tab="rel" aria-selected="false">Relatório da secretaria</button>
    <button role="tab" data-tab="risk" aria-selected="false">Mapa de riscos</button>
    <button role="tab" data-tab="team" aria-selected="false">Equipe e acessos</button>
    <button role="tab" data-tab="conf" aria-selected="false">Conflito de interesses</button>
  </nav>
  <div class="demo">Protótipo para validação do desenho. Todos os nomes, números e datas abaixo são exemplos e nada é salvo.</div>
  <main id="view"></main>
</div>

<script>
const BLOCOS=["Estrutura e pessoas","Orçamento","Contratos e convênios","Obras e projetos","Passivos e riscos jurídicos","Sistemas e dados","Agenda dos 100 dias","Riscos imediatos"];
const GRUPOS=["Fazenda","Planejamento e Administração","Previdência","Saúde","Educação","Segurança Pública","Infraestrutura e Logística","Agricultura e Meio Ambiente","Assistência Social e Desenvolvimento","Casa Civil, PGE e Controladoria","Estatais"];
const ST=[
 {k:"Não solicitado",i:"–"},{k:"Solicitado",i:"◔"},{k:"Parcial",i:"◑"},{k:"Entregue",i:"●"},{k:"Validado",i:"✓"},{k:"Não entregue no prazo",i:"!"}];
const PONTOS={
 "Riscos fiscais":["Despesa sem caixa nos últimos 8 meses","Aumento de despesa com pessoal (180 dias finais)","Nomeações e reajustes no período eleitoral","Operações de crédito no último ano de mandato","Caixa insuficiente em janeiro","Restos a pagar elevados","Receita superestimada na LOA 2027","Aportes da previdência subestimados","Incentivos fiscais novos sem estimativa"],
 "Riscos contratuais e jurídicos":["Contratos essenciais vencendo","Contratos assinados às pressas","Obras paradas ou com medição adiantada","Passivos judiciais acima de R$ 10 milhões","Pendências de regularidade (CAUC)"],
 "Riscos de pessoas e serviços":["Perda de conhecimento","Temporários sem contrato em fevereiro","Início do ano letivo","Serviços de saúde (estoque de medicamentos)","Segurança pública (viaturas, combustível, alimentação)"],
 "Riscos de informação e sistemas":["Apagamento ou retenção de dados","Informação incompleta","Vazamento"],
 "Riscos políticos e institucionais":["Transição tardia ou limitada","LOA votada sem ajustes","Nomeações para mandatos fixos","Expectativas públicas"]};
const FASES=[["0 Preparação","antes da eleição"],["1 Instalação","semanas 1 e 2"],["2 Diagnóstico","semanas 2 a 6"],["3 Consolidação","semanas 6 a 8"],["4 Pré-posse","semanas 8 a 10"],["5 Cem dias","6/1 a 15/4"]];
const FASE_ATUAL=1;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date();today.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addBiz=(d,n)=>{const x=new Date(d);while(n>0){x.setDate(x.getDate()+1);if(x.getDay()%6)n--}return x};
const fmt=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const fmtL=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
const POSSE=new Date(2027,0,6);
const diasPosse=Math.max(0,Math.round((POSSE-today)/864e5));

const matrix=GRUPOS.map((g,gi)=>BLOCOS.map((b,bi)=>(gi*5+bi*3+((gi*bi)%4))%6));
const oficios=[
 [3,"Fluxo de caixa diário de dezembro a março",8,"abertos"],
 [3,"Estoque de medicamentos e insumos",8,"aberto"],
 [0,"Restos a pagar por credor e data",9,"aberto"],
 [0,"Estoque e serviço da dívida em 2027",6,"respondido"],
 [4,"Contratos de transporte escolar e merenda",7,"aberto"],
 [5,"Contratos de alimentação do sistema prisional",3,"aberto"],
 [9,"Ações judiciais acima de R$ 10 milhões",4,"respondido"],
 [2,"Cálculo atuarial e cronograma de aportes",2,"aberto"],
 [6,"Obras paralisadas e motivos",1,"aberto"],
 [1,"Concursos em andamento ou homologados",10,"respondido"]
].map((o,i)=>{const env=addDays(today,-o[2]);return{n:`${String(i+1).padStart(3,"0")}/2026`,g:o[0],a:o[1],env,prazo:addBiz(env,5),s:o[3]==="respondido"?"respondido":"aberto",anexos:[],txt:"",bl:[]}});
let riscos=[
 {g:3,p:"Serviços de saúde (estoque de medicamentos)",d:"Contrato de fornecimento de medicamentos vence em 15/1/2027 sem licitação concluída",pr:3,im:3,r:"Coordenador do grupo Saúde",pz:"20/12"},
 {g:0,p:"Caixa insuficiente em janeiro",d:"Folha de dezembro e 13º pagos com receita prevista de 2027",pr:2,im:3,r:"Núcleo fiscal",pz:"06/01"},
 {g:4,p:"Início do ano letivo",d:"Transporte escolar sem contrato vigente para fevereiro",pr:2,im:2,r:"Coordenador do grupo Educação",pz:"15/01"},
 {g:7,p:"Perda de conhecimento",d:"Exoneração em massa de comissionados em dezembro",pr:1,im:2,r:"Núcleo de gestão e pessoas",pz:"15/02"}];
const classe=n=>n>=6?["Crítico","crit"]:n>=3?["Alto","high"]:["Moderado","mod"];
let sel=null,relG=3;
const termos={assinados:34,total:41};

const $=s=>document.querySelector(s),view=$("#view");
let tab="dash";

function kpis(){
  const tot=GRUPOS.length*BLOCOS.length;
  const val=matrix.flat().filter(v=>v===4).length;
  const abertosAtras=oficios.filter(o=>o.s==="aberto"&&o.prazo<today).length+matrix.flat().filter(v=>v===5).length;
  const crit=riscos.filter(r=>r.pr*r.im>=6).length;
  return [[Math.round(val/tot*100)+"%","relatório validado"],[oficios.filter(o=>o.s==="aberto").length,"ofícios aguardando resposta"],[abertosAtras,"pedidos fora do prazo",abertosAtras>0],[crit,"riscos críticos",crit>0],[termos.total-termos.assinados,"termos de sigilo pendentes",true]];
}
function dash(){
  const ks=kpis().map(k=>`<div class="kpi ${k[2]?"bad":""}"><div class="n">${k[0]}</div><div class="l">${k[1]}</div></div>`).join("");
  const ph=FASES.map((f,i)=>`<div class="ph ${i<FASE_ATUAL?"done":i===FASE_ATUAL?"now":""}"><b>${f[0]}</b>${f[1]}</div>`).join("");
  const rows=GRUPOS.map((g,gi)=>{
    const v=matrix[gi].filter(x=>x===4).length,pct=Math.round(v/BLOCOS.length*100);
    const cells=matrix[gi].map((s,bi)=>`<td class="cell"><button class="cellbtn st-${s}" data-g="${gi}" data-b="${bi}" aria-pressed="${sel&&sel[0]===gi&&sel[1]===bi}" aria-label="${esc(g)}, bloco ${bi+1}, ${ST[s].k}" title="${ST[s].k}">${ST[s].i}</button></td>`).join("");
    return `<tr><th scope="row" style="white-space:normal;min-width:150px;color:var(--ink)">${esc(g)}</th>${cells}<td style="min-width:90px"><div class="bar" title="${pct}% validado"><i style="width:${pct}%"></i></div></td></tr>`}).join("");
  const heads=BLOCOS.map((b,i)=>`<th class="col" title="${esc(b)}">B${i+1}</th>`).join("");
  const legend=ST.map((s,i)=>`<span><i class="sw st-${i}">${s.i}</i>${s.k}</span>`).join("");
  const venc=oficios.filter(o=>o.s==="aberto").sort((a,b)=>a.prazo-b.prazo).slice(0,5).map(o=>{const late=o.prazo<today;return `<li><div><b>${esc(GRUPOS[o.g])}</b><small>${esc(o.a)}</small></div><span class="pill ${late?"late":"open"}">${late?"venceu ":"vence "}${fmt(o.prazo)}</span></li>`}).join("");
  const rc=riscos.filter(r=>r.pr*r.im>=6).map(r=>`<li><div><b>${esc(GRUPOS[r.g])}</b><small>${esc(r.d)}</small></div><span class="pill crit">${r.pr*r.im}</span></li>`).join("")||`<li class="note">Nenhum risco crítico registrado.</li>`;
  let det="";
  if(sel){const [g,b]=sel;det=`<div class="detail"><div><b>${esc(GRUPOS[g])}</b><br><span class="note">Bloco ${b+1} · ${esc(BLOCOS[b])}</span></div>
   <label class="f">Situação<select id="setst">${ST.map((s,i)=>`<option value="${i}" ${matrix[g][b]===i?"selected":""}>${s.k}</option>`).join("")}</select></label>
   <button class="btn sec sm" data-open="${g}">Abrir relatório da secretaria</button></div>`}
  return `<div class="grid">
   <div class="panel countdown"><div><div class="big">${diasPosse}</div><div class="note">dias até a posse, em ${fmtL(POSSE)}</div></div><div class="phases">${ph}</div></div>
   <div class="grid kpis">${ks}</div>
   <div class="grid twoCol">
    <div class="panel"><h2>Relatório por secretaria</h2><p class="sub">Cada linha é um grupo temático e cada coluna, um dos 8 blocos do relatório padrão. Clique em uma célula para ver ou mudar a situação.</p>

function confRes(){
  const q=D.q,blocks=new Set(),rest=[],par=[];
  const unanswered=CQ.filter(c=>!q[c[0]]).length;
  if(q.forn==="s"){D.areas.forn.forEach(i=>blocks.add(i));if(!D.areas.forn.length)par.push("Indique as áreas em que há vínculo com fornecedor.")}
  if(q.par==="s"){D.areas.par.forEach(i=>blocks.add(i));if(!D.areas.par.length)par.push("Indique as áreas em que há parente em cargo de direção.")}
  if(q.atual==="s"){rest.push(`Marcado como "vínculo ativo com o governo atual": acesso técnico, sem acesso aos dossiês do próprio órgão${D.orgao?" ("+D.orgao+")":""}. O que vier desse órgão chega só por ofício.`);if(D.funcao!=="oper")par.push("Função de chefia, contratos ou orçamento: pedir parecer da PGE antes de liberar o acesso.")}

  if(q.lobby==="s")par.push("Atividade de consultoria ou representação de clientes: parecer sobre a atuação nas áreas relacionadas.");
  if(q.doa==="s")rest.push("Doação ou cargo partidário registrado como informação, sem bloqueio automático.");
  if(q.info==="s")par.push("Acesso anterior a informação sigilosa fora dos canais oficiais: parecer jurídico e orientação de não utilizá-la.");

  let status="Liberado",tone="ok";
  if(par.length){status="Aguardando parecer";tone="late"}else if(bl.length||rest.length){status="Liberado com restrições";tone="high"}
  return {unanswered,bl,rest,par,status,tone};
}

   <div class="actions" style="margin-top:10px"><button class="btn" id="c-send">Enviar declaração</button></div>
   ${D.msg?`<div class="${D.msg.startsWith("Declaração enviada")?"okmsg":"warn"}">${esc(D.msg)}</div>`:""}</div>
   <div class="panel" style="align-self:start"><h3>Resultado desta declaração</h3>${res}</div></div>
  <div class="panel"><h2>Fila de análise da Administração</h2><p class="sub">Alcione Gomes aprova ou encaminha para parecer. Cada decisão fica na trilha de auditoria.</p>
   <div class="scroll"><table><thead><tr><th>Membro</th><th>Grupo</th><th>Resultado</th><th></th></tr></thead><tbody>${q}</tbody></table></div></div></div>`;
}
view.addEventListener("input",e=>{if(e.target.dataset.rk!==undefined)REL[e.target.dataset.rk]=e.target.value;if(e.target.id==="c-nome")D.nome=e.target.value;if(e.target.id==="c-org")D.orgao=e.target.value});
view.addEventListener("change",e=>{
  const t=e.target,id=t.id||"";
  if(t.dataset.cq!==undefined){D.q[t.dataset.cq]=t.value;D.msg="";render();return}
  if(t.dataset.ca!==undefined){const a=D.areas[t.dataset.ca],v=+t.value;D.areas[t.dataset.ca]=t.checked?[...a,v]:a.filter(x=>x!==v);D.msg="";render();return}
  if(id==="c-g"){D.grupo=+t.value}
  if(id==="c-fun"){D.funcao=t.value;D.msg="";render()}
  if(id==="c-termo")D.termo=t.checked;
  if(id==="c-org"||id==="c-nome")return;
});
view.addEventListener("click",e=>{
  if(e.target.dataset.capr!==undefined){decl[+e.target.dataset.capr].ok=true;render();return}
  if(e.target.id==="c-send"){const r=confRes();
    if(!D.nome.trim()){D.msg="Informe o nome completo.";render();return}
    if(r.unanswered){D.msg="Responda todas as perguntas antes de enviar.";render();return}
    if(!D.termo){D.msg="Marque a assinatura do Termo de confidencialidade.";render();return}
    const det=[...r.bl.map(i=>"Bloqueado em "+GRUPOS[i]),...r.rest,...r.par].join(" · ")||"Sem vínculos declarados.";
    decl.unshift({n:D.nome.trim(),g:D.grupo,res:r.status,tone:r.tone,ok:false,det});
    D.msg="Declaração enviada para análise da Administração.";D.nome="";D.q={};D.areas={forn:[],par:[],cargo:[]};D.orgao="";D.termo=false;render()}
});

function render(){
  const op=tab==="rel"?[...view.querySelectorAll("details.blk")].map(d=>d.open):[];
  view.innerHTML={dash,of:ofView,gen:genView,aut:autView,rel:relView,risk:riskView,team:teamView,conf:confView}[tab]();
  if(tab==="rel"&&op.length===BLOCOS.length+1)view.querySelectorAll("details.blk").forEach((d,i)=>{d.open=op[i]});
  if(tab==="rel")view.querySelectorAll("details.blk").forEach((d,bi)=>d.querySelectorAll("input:not([type=file]),textarea,select:not([data-bst])").forEach((el,k)=>{const key=relG+"|"+bi+"|"+k;el.dataset.rk=key;if(REL[key]!==undefined)el.value=REL[key]}));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;render()}});
view.addEventListener("click",e=>{
  const c=e.target.closest(".cellbtn");if(c){sel=[+c.dataset.g,+c.dataset.b];render();return}
  const o=e.target.closest("[data-open]");if(o){relG=+o.dataset.open;tab="rel";render();return}
  const r=e.target.closest("[data-resp]");if(r){const x=oficios.find(z=>z.n===r.dataset.resp);if(x){x.s="respondido";bump(x.g,x.bl,3,3)}render();return}
  const vv=e.target.closest("[data-ver]");if(vv){const n=vv.dataset.ver;OPEN.has(n)?OPEN.delete(n):OPEN.add(n);render();return}
  const ar=e.target.closest("[data-addrow]");if(ar){const k=relG+"|"+ar.dataset.addrow;ROWS[k]=(ROWS[k]||(ar.dataset.addrow==="2"?2:1))+1;render();return}
  if(e.target.id==="of-add"){const a=$("#of-a").value.trim();if(!a){$("#of-a").focus();return}
    const env=new Date($("#of-d").value+"T00:00:00");oficios.push({n:`${String(oficios.length+1).padStart(3,"0")}/2026`,g:+$("#of-g").value,a,env,prazo:addBiz(env,5),s:"aberto",anexos:[],txt:"",bl:[]});render();return}
  if(e.target.id==="rk-add"){const d=$("#rk-d").value.trim();if(!d){$("#rk-d").focus();return}
    riscos.push({g:+$("#rk-g").value,p:$("#rk-p").value,d,pr:+$("#rk-pr").value,im:+$("#rk-im").value,r:$("#rk-r").value||"A definir",pz:$("#rk-z").value||"–"});render();return}
});
view.addEventListener("change",e=>{
  if(e.target.id==="setst"&&sel){matrix[sel[0]][sel[1]]=+e.target.value;render();return}
  if(e.target.id==="relg"){relG=+e.target.value;render();return}
  if(e.target.dataset.rk!==undefined&&e.target.tagName==="SELECT")REL[e.target.dataset.rk]=e.target.value;
  if(e.target.dataset.attach!==undefined){const k=relG+"|"+e.target.dataset.attach,b=+e.target.dataset.attach;ATT[k]=(ATT[k]||[]).concat([...e.target.files].map(f=>f.name));if(matrix[relG][b]<2)matrix[relG][b]=2;render();return}
  if(e.target.dataset.bst!==undefined){matrix[relG][+e.target.dataset.bst]=+e.target.value;render();return}
  if(e.target.dataset.respfile!==undefined){const x=oficios.find(z=>z.n===e.target.dataset.respfile);if(x){x.anexos=x.anexos.concat([...e.target.files].map(f=>f.name));x.s="respondido";bump(x.g,x.bl,3,3)}render();return}
});
render();
/* ===== Botão de fundo escuro (paleta azul) ===== */
(function(){
  const root=document.documentElement,btn=document.querySelector("#theme-btn");
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const paint=()=>{const d=isDark();btn.textContent=d?"☀ Fundo claro":"◐ Fundo escuro";btn.setAttribute("aria-pressed",String(d))};
  try{const t=localStorage.getItem("tema");if(t)root.dataset.theme=t}catch(_){}
  btn.addEventListener("click",()=>{const n=isDark()?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(_){}paint()});
  paint();
})();
</script>
